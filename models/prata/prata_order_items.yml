version: 2

models:
  - name: prata_order_items
    description: >
      Tabela silver contendo os itens dos pedidos com dados padronizados
      e validados a partir da camada raw.

    config:
      contract:
        enforced: true

    columns:
      - name: order_id
        data_type: varchar
        description: Identificador único do pedido.

        tests:
          - not_null

      - name: order_item_id
        data_type: integer
        description: Sequencial do item dentro do pedido.

        tests:
          - not_null

      - name: product_id
        data_type: varchar
        description: Identificador único do produto associado ao item.

        tests:
          - not_null

      - name: seller_id
        data_type: varchar
        description: Identificador único do vendedor responsável pelo item.

        tests:
          - not_null

      - name: price
        data_type: double
        description: Valor bruto do produto no momento da compra.

        tests:
          - not_null

      - name: freight_value
        data_type: double
        description: Valor do frete cobrado para entrega do item.
        tests:
          - not_null

      - name: ingestion_timestamp
        data_type: timestamp

    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - order_id
            - order_item_id